openapi: 3.0.0

info:
  description: |
    This is the expense tracking app
  version: 1.0.0
  title: Expense

tags:
  - name: Groups
    description: Group management APIs
  - name: Auth
    description: Authentication APIs

paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ILogin"
      responses:
        "200":
          description: Success
          headers:
            Set-Cookie:
              description: Session cookie
              schmea:
                type: string
                example: session_id=abc123; HttpOnly; Secure; SameSite=Lax; Path=/
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/groups:
    security:
      - sessionCookie: []

    get:
      tags:
        - Groups
      operationId: getMyGroups
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsList"

    post:
      tags:
        - Groups
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IGroup"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/groups/{id}:
    security:
      - sessionCookie: []

    parameters:
      - name: id
        required: true
        in: path
        schema:
          type: integer
    get:
      tags:
        - Groups
      operationId: getGroup
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"

    put:
      tags:
        - Groups
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IGroup"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"

    delete:
      tags:
        - Groups
      operationId: deleteGroup
      responses:
        "204":
          description: Success
        "409":
          description: Conflict. Some Condition failed
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id

  schemas:
    ILogin:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    GroupsList:
      type: array
      items:
        $ref: "#/components/schemas/Group"

    Group:
      allOf:
        - $ref: "#/components/schemas/IGroup"
        - $ref: "#/components/schemas/Id"

    IGroup:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    Id:
      type: object
      required:
        - id
      properties:
        id:
          type: integer

  responses:
    BadRequest:
      description: Bad request or input
